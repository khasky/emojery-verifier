# Scheduled independent verification → status surface, for BOTH environments.
#
# A matrix job runs the real verifier against each environment's public API + log and
# POSTs its PASS/FAIL verdict to that environment's status-ingest endpoint. This
# is the out-of-band, independent check the backend cannot perform on its own data.
#
# Required GitHub settings on THIS repo — per environment
# (Settings → Environments → production / staging → add each):
#   - Variable  LOG_PUBKEY        — that env's published Ed25519 public key (base64). Public.
#   - Secret    STATUS_INGEST_KEY — matches that env's backend STATUS_INGEST_KEY secret.
# The prod and staging keys DIFFER (each env signs its own log), so they MUST live on
# the environments, not as a single repo-level value. Leaving them repo-level (or as a
# repo `Secret` for LOG_PUBKEY, which the workflow reads via `vars.`) resolves to empty.
#
# Identity-track pins (all optional, all public, all per environment — staging signs
# blind grants and proves enrollments under its own material, which must not fall back
# to the production values pinned in verify.mjs):
#   - Variable  BLIND_PUBKEY_SPKI  — the blind-signing RSA public key (SPKI, base64).
#   - Variable  ENROLL_VK_SHA256   — SHA-256 of keys/enroll-v1.vk in that env's log repo.
#   - Variable  SALT_COMMITMENT    — SHA-256 of that env's nullifier salt.
#   - Variable  OIDC_AUDIENCES     — comma-separated OAuth client ids of that env.
#   - Variable  OIDC_ISSUERS       — comma-separated provider=iss pairs; staging adds its
#                                    test issuer here. Empty keeps the verifier's default list.
# An empty variable leaves the flag off, and the check that needs it reports a skip.
#
# --allow-unsigned-votes stays on both targets while 1.0.0 clients (no vote signature)
# are still served; it comes off at the OTP cutover, when an unsigned vote becomes a
# failure again.
#
# Note: --ots is intentionally omitted. OpenTimestamps matures over hours–days, so a
# young log has no Bitcoin proof yet and --ots would report FAIL; the Bitcoin component
# is derived separately (and leniently) by the backend. This job covers the core
# tamper-evidence checks (signature, Merkle re-fold, revocations, invariants)
# plus the Sigstore Rekor cross-check, which now runs by default (an unreachable Rekor
# downgrades to a skip, so a third-party outage can't flip this verdict to FAIL).

name: verify-and-report

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # a staging failure must not cancel the production check
      matrix:
        include:
          - target: production
            api: https://api.emojery.app
            repo: https://raw.githubusercontent.com/khasky/emojery-log/main
          - target: staging
            api: https://api-staging.emojery.app
            repo: https://raw.githubusercontent.com/khasky/emojery-log-staging/main
    environment: ${{ matrix.target }}
    concurrency:
      group: verify-and-report-${{ matrix.target }}
      cancel-in-progress: false
    env:
      API: ${{ matrix.api }}
      REPO: ${{ matrix.repo }}
      LOG_PUBKEY: ${{ vars.LOG_PUBKEY }}
      STATUS_INGEST_KEY: ${{ secrets.STATUS_INGEST_KEY }}
      BLIND_PUBKEY_SPKI: ${{ vars.BLIND_PUBKEY_SPKI }}
      ENROLL_VK_SHA256: ${{ vars.ENROLL_VK_SHA256 }}
      SALT_COMMITMENT: ${{ vars.SALT_COMMITMENT }}
      OIDC_AUDIENCES: ${{ vars.OIDC_AUDIENCES }}
      OIDC_ISSUERS: ${{ vars.OIDC_ISSUERS }}
      KEYS_PER_ACCOUNT: ${{ vars.KEYS_PER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Reproducible install: honor the committed lockfile, and skip dependency
      # lifecycle scripts, so a compromised transitive postinstall can't run with the
      # job's secrets in scope. @noble/ed25519 is pure JS; @aztec/bb.js ships its wasm
      # prebuilt and its one native optional (msgpackr-extract) has a pure-JS fallback.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # A missing key would reach the verifier as `--pubkey ""`, which it now refuses;
      # catching it here says WHICH setting is missing instead of leaving that to be
      # inferred from an argument error.
      - name: Check the environment carries LOG_PUBKEY
        run: |
          if [ -z "$LOG_PUBKEY" ]; then
            echo "::error::LOG_PUBKEY is empty for the '${{ matrix.target }}' environment. It is an ENVIRONMENT variable (Settings → Environments → ${{ matrix.target }} → Variables), not a repository one, and not a secret — the workflow reads it via vars."
            exit 1
          fi

      - name: Run verifier (--json)
        env:
          # Lifts the unauthenticated api.github.com quota for the checkpoint-archive
          # listing (shared runner IPs are routinely rate-limited; without a token the
          # archive check would downgrade to a skip instead of running).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          # --entries repo: the leaves come from the log repo's 10k-leaf shards, not
          # from 1000-leaf API pages. On a large log that is the difference between
          # ~100 unmetered raw.githubusercontent.com reads and a thousand requests
          # against the API's per-IP /log/* limit from a shared runner IP. --api stays
          # on, so the checkpoint, the revocation comparison and the 3d entries
          # cross-check still exercise the live endpoints.
          # Identity pins ride in as flags only when the environment sets them: the
          # verifier refuses an empty value, and a skip names the missing pin.
          pins=()
          [ -n "$BLIND_PUBKEY_SPKI" ] && pins+=(--blind-pubkey "$BLIND_PUBKEY_SPKI")
          [ -n "$ENROLL_VK_SHA256" ] && pins+=(--enroll-vk-hash "$ENROLL_VK_SHA256")
          [ -n "$SALT_COMMITMENT" ] && pins+=(--salt-commitment "$SALT_COMMITMENT")
          [ -n "$OIDC_AUDIENCES" ] && pins+=(--audiences "$OIDC_AUDIENCES")
          [ -n "$OIDC_ISSUERS" ] && pins+=(--issuers "$OIDC_ISSUERS")
          # KEYS_PER_ACCOUNT=0 lifts the per-epoch grant bound where a shared test
          # account legitimately holds more keys than one person would.
          [ -n "$KEYS_PER_ACCOUNT" ] && pins+=(--keys-per-account "$KEYS_PER_ACCOUNT")
          node src/verify.mjs --json --api "$API" --repo "$REPO" --entries repo --pubkey "$LOG_PUBKEY" --allow-unsigned-votes "${pins[@]}" > result.json
          code=$?
          set -e
          # If the verifier crashed before emitting JSON, synthesize an explicit fail so
          # the status surface reflects the failure instead of going stale.
          if ! node -e "JSON.parse(require('fs').readFileSync('result.json','utf8'))" 2>/dev/null; then
            printf '{"result":"fail","checks":{"run":"fail"},"ts":%s000}\n' "$(date +%s)" > result.json
          fi
          echo "verifier exit code: $code"
          cat result.json
          # The verdict is carried forward instead of failing here: the whole point of
          # this job is to REPORT a failure, and a failed step would skip the ingest
          # below. The final step turns it into the job's status, so a fork with no
          # ingest secret still sees a red run — a green-whatever-happens audit trail
          # is worse than none, because it reads as "checked, fine".
          echo "VERIFY_RESULT=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('result.json','utf8')).result ?? 'fail'))")" >> "$GITHUB_ENV"
          echo "VERIFY_EXIT=$code" >> "$GITHUB_ENV"

      - name: Report to /status/ingest
        if: ${{ env.STATUS_INGEST_KEY != '' }}
        run: |
          # Whitespace-strip the secret: a value pasted with a trailing newline or
          # space is sent verbatim and can never match the backend's, and the 403 it
          # earns is indistinguishable from a genuinely wrong key.
          key="$(printf '%s' "$STATUS_INGEST_KEY" | tr -d '[:space:]')"
          # -f would swallow the body; the API's error string is the whole
          # diagnosis (forbidden = key mismatch, status_ingest_disabled = ingest
          # is not enabled on that environment), and it carries nothing secret.
          # Idempotency-Key: this run, this attempt. The endpoint appends a verdict to the
          # public 90-day history on every call, so a retry of a POST whose response was
          # lost would publish the same verdict twice; with the key the replay is a no-op.
          # A re-run of the job is a NEW attempt and so a new key - that is a genuine
          # second verdict, and it belongs in the history.
          # The target is in the key as well as the run: the matrix fans out over the
          # deployments, and two of them must never claim each other's key.
          run_key="gha-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-1}-${{ matrix.target }}"
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$API/status/ingest" \
            -H "idempotency-key: $run_key" \
            -H "x-status-key: $key" \
            -H "content-type: application/json" \
            --data @result.json)
          body=$(cat response.json)
          echo "ingest HTTP $code: $body"
          # 2xx, not 200 exactly: the endpoint answers 202 (accepted), the same
          # acknowledgement every other write on that API gives.
          case "$code" in
            2??) ;;
            *)
              echo "::error::POST $API/status/ingest failed (HTTP $code: $body). If forbidden, this environment's STATUS_INGEST_KEY secret no longer matches the backend's — rotate both together."
              exit 1
              ;;
          esac

      # Runs even when the ingest step failed, so the verdict is never lost behind a
      # reporting problem.
      - name: Fail the job when the log did not verify
        if: ${{ always() }}
        run: |
          echo "verdict: ${VERIFY_RESULT:-missing} (verifier exit ${VERIFY_EXIT:-?})"
          if [ "${VERIFY_RESULT:-}" != "pass" ]; then
            echo "::error::${{ matrix.target }} did not verify (result=${VERIFY_RESULT:-missing}). Read result.json in the step above: each check is pass/fail/skip."
            exit 1
          fi
