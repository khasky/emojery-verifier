name: Self-test

# The offline suites, on every change: the shared log vectors among them, so a byte the
# publisher and this verifier read differently fails the pull request that introduced
# it rather than the next daily run against a live log.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm selftest
